# Server Configuration
server:
  port: 8080
  address: 0.0.0.0

# Database Configuration (H2 for testing)
spring:
  datasource:
    url: jdbc:h2:mem:sma_db;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    
  h2:
    console:
      enabled: true
      path: /h2-console
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:sma-secret-key-for-jwt-token-generation-minimum-256-bits-long}
  expiration: ${JWT_EXPIRATION:86400000}

# Application Configuration
app:
  name: Smart Meal Autopilot
  version: 1.0.0

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://10.0.2.2:8080}

# Rate Limit Configuration
rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS:60}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.smartmeal: INFO
    org.springframework.security: INFO

# Recommendation Engine Configuration
recommendation:
  variety-window-days: 7
  history-weight-days: 30
  history-decay-rate: 0.9
  restaurant-affinity-weight: 15

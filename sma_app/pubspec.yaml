name: sma_app
description: Smart Meal Autopilot - Your AI-powered food ordering assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10+1
  json_annotation: ^4.8.1
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.0
  google_sign_in: ^6.2.1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
